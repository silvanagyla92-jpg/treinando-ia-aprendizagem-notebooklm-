name: Padronizar rodapés dos arquivos Markdown

on:
  push:
    branches:
      - padronizacao-rodapes-v2

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Padronizar rodapés sem alterar o conteúdo anterior
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          FOOTER = '''---\n\n**Projeto:** Gestão Financeira Pessoal com NotebookLM\n\n**Autora:** Nágyla Silva\n\nProjeto integrante do portfólio prático em Inteligência Artificial, desenvolvido para demonstração de competências em treinamento e avaliação de sistemas de IA, análise crítica de respostas e anotação de dados, aplicado às funções de AI Trainer, AI Response Evaluator e Data Annotator, com base em experiência em QA e Auditoria.'''

          OLD_MARKERS = [
              'Projeto integrante do portfólio prático de estudos em Inteligência Artificial',
              'Projeto integrante do portfólio prático em Inteligência Artificial',
          ]

          def replace_footer(text: str) -> str:
              # Remove somente o último bloco de rodapé já existente, quando identificado.
              positions = [text.rfind(marker) for marker in OLD_MARKERS]
              pos = max(positions)
              if pos >= 0:
                  start = text.rfind('---', 0, pos)
                  if start >= 0:
                      return text[:start].rstrip() + '\n\n' + FOOTER + '\n'
              # Se não houver rodapé identificável, preserva integralmente o conteúdo e adiciona o padrão ao final.
              return text.rstrip() + '\n\n' + FOOTER + '\n'

          changed = []
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              original = path.read_text(encoding='utf-8')
              updated = replace_footer(original)
              if path.as_posix() == 'README.md':
                  old = 'O projeto utiliza **25 fontes**, distribuídas em quatro categorias:'
                  new = 'O acervo documental do projeto reúne **25 fontes**, sendo **23 referências externas e 2 documentos internos**, distribuídas em quatro categorias:'
                  updated = updated.replace(old, new, 1)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          if not changed:
              print('Nenhum arquivo Markdown precisou de alteração.')
          else:
              print('Arquivos alterados:')
              print('\n'.join(changed))

              subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
              subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', '--', '*.md', 'README.md', 'analises', 'catalogacao', 'evidencias', 'fontes', 'glossario', 'prompts', 'video'], check=True)
              subprocess.run(['git', 'commit', '-m', 'docs: padronizar rodapés dos arquivos markdown'], check=True)
              subprocess.run(['git', 'push'], check=True)
